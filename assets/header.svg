<svg width="850" height="260" viewBox="0 0 850 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Ryan — Global Trade x AI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F1E">
        <animate attributeName="stop-color" values="#0A0F1E;#0D1730;#0A0F1E" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#101E42">
        <animate attributeName="stop-color" values="#101E42;#17295A;#101E42" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1B1240">
        <animate attributeName="stop-color" values="#1B1240;#291A55;#1B1240" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A93D"/>
      <stop offset="0.5" stop-color="#FFE9B0"/>
      <stop offset="1" stop-color="#E8A93D"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#4A5C94"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="round">
      <rect width="850" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="850" height="260" fill="url(#bg)"/>
    <rect width="850" height="260" fill="url(#dots)" opacity="0.22"/>

    <!-- moving waves (bottom) -->
    <path fill="#1D2C55" opacity="0.55"
      d="M0 214 Q106 196 212 214 T424 214 T636 214 T848 214 T1060 214 T1272 214 T1484 214 T1696 214 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-424 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#24386B" opacity="0.5"
      d="M0 228 Q106 212 212 228 T424 228 T636 228 T848 228 T1060 228 T1272 228 T1484 228 T1696 228 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-424 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>

    <!-- shipping route: KRPUS -> USLAX with a moving cargo dot -->
    <path id="route" d="M560 150 C625 84 715 82 788 136" stroke="#44548C" stroke-width="1.6" stroke-dasharray="4 7" fill="none"/>
    <circle cx="560" cy="150" r="4" fill="#58A6FF"/>
    <circle cx="788" cy="136" r="4" fill="#58A6FF"/>
    <circle r="3.6" fill="#F5C044" filter="url(#glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="none">
        <mpath xlink:href="#route"/>
      </animateMotion>
    </circle>
    <text x="541" y="171" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" letter-spacing="2" fill="#7E8BB6">KRPUS</text>
    <text x="770" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" letter-spacing="2" fill="#7E8BB6">USLAX</text>

    <!-- accent bar -->
    <rect x="62" y="64" height="5" rx="2.5" fill="#F0B429" width="46">
      <animate attributeName="width" values="46;72;46" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- name + taglines -->
    <text x="60" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="3" fill="url(#gold)">RYAN</text>
    <text x="63" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="5" fill="#9DA9CE">GLOBAL TRADE &#215; AI BUILDER</text>
    <text x="63" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="1" fill="#6C79A8">CUSTOMS &#183; FTA ORIGIN &#183; L/C &#183; HS CODE &#8212; NOW SHIPPING CODE TOO</text>
  </g>
</svg>
